<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      background-color: transparent !important;
      margin: 0; padding: 0; overflow: hidden; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      -webkit-app-region: drag; 
    }

    .pill {
      display: flex; align-items: center; justify-content: center;
      background: #1C1C1E;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      /* Smoothly animates the size change between states */
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dynamic padding for perfect centering */
    .pill.listening { padding: 12px 24px; }
    .pill.processing { padding: 14px 22px; }

    /* --- LISTENING STATE --- */
    .waveform {
      display: none; gap: 3px; align-items: center;
    }
    .listening .waveform {
      display: flex;
    }

    .bar {
      width: 4px; border-radius: 2px;
      background-color: #10B981; 
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
      height: 4px; 
      animation: bounce 0.5s ease-in-out infinite alternate;
    }
    
    .listening .bar:nth-child(1) { animation-delay: 0.0s; }
    .listening .bar:nth-child(2) { animation-delay: 0.1s; }
    .listening .bar:nth-child(3) { animation-delay: 0.2s; }
    .listening .bar:nth-child(4) { animation-delay: 0.3s; }
    .listening .bar:nth-child(5) { animation-delay: 0.4s; }
    .listening .bar:nth-child(6) { animation-delay: 0.2s; }
    .listening .bar:nth-child(7) { animation-delay: 0.1s; }
    .listening .bar:nth-child(8) { animation-delay: 0.0s; }

    /* --- PROCESSING STATE --- */
    .dots {
      display: none; gap: 6px; align-items: center; justify-content: center;
    }
    .processing .dots {
      display: flex;
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: #E9D5FF; 
      animation: pulse-dot 0.6s infinite alternate;
    }
    .dot:nth-child(2) {
      background-color: #8B5CF6; 
      animation-delay: 0.2s;
    }
    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 22px; }
    }
    
    @keyframes pulse-dot {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body data-tauri-drag-region>
  <div class="pill" id="pill" data-tauri-drag-region>
    <div class="waveform">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
