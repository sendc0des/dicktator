[package]
name = "dicktator"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dicktator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"      # Required by default Tauri v2 setup
tauri-plugin-opener = "2.0.0"     # Required by default Tauri v2 setup
tauri-plugin-global-shortcut = "2.0.0" 
cpal = "0.15"                          
hound = "3.5"                         
reqwest = { version = "0.11", features = ["json", "multipart"] } 
tokio = { version = "1", features = ["full"] }      
rdev = "0.5"                           
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rubato = "0.14"
base64 = "0.21" # We need this to encode the audio for OpenRouter\
enigo = "0.6.1"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
arboard = "3.4"
dotenvy = "0.15"